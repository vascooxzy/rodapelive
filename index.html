<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rodapé XAUUSD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
     { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: "Montserrat", Arial, sans-serif;
    }

    .footer {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 180px;
      display: flex;
      overflow: hidden;
      color: #fff;
      background: #05070a;
      border: 1px solid #142834;
    }

    .top-line {
      position: absolute;
      inset: 0 0 auto;
      height: 3px;
      background: #00e5ff;
      z-index: 3;
    }

    .brand {
      width: 230px;
      flex: 0 0 230px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border-right: 1px solid #17313a;
    }

    .brand img {
      display: block;
      max-width: 170px;
      max-height: 98px;
      object-fit: contain;
    }

    .live-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #8ceefa;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00e5ff;
      animation: pulse 1.8s ease-in-out infinite;
    }

    .main {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .message-area {
      position: relative;
      min-height: 0;
      flex: 1;
      display: flex;
      align-items: center;
      padding: 0 30px;
      overflow: hidden;
    }

    .message {
      position: absolute;
      left: 30px;
      right: 24px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .45s ease, transform .45s ease;
      pointer-events: none;
    }

    .message.active {
      opacity: 1;
      transform: translateY(0);
    }

    .headline {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: .4px;
    }

    .check {
      width: 26px;
      height: 26px;
      flex: 0 0 26px;
      display: grid;
      place-items: center;
      border: 2px solid #00e5ff;
      color: #fff;
    }

    .check svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 3;
    }

    .subline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
      font-size: 15px;
      font-weight: 700;
    }

    .cyan { color: #8ceefa; }

    .arrow {
      width: 22px;
      height: 14px;
      fill: none;
      stroke: #00e5ff;
      stroke-width: 2.5;
      animation: nudge 1.4s ease-in-out infinite;
    }

    .notice-title {
      margin-bottom: 7px;
      color: #8ceefa;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: .7px;
      text-transform: uppercase;
    }

    .notice-copy {
      font-size: 15px;
      line-height: 1.45;
      font-weight: 700;
    }

    .ticker {
      height: 34px;
      flex: 0 0 34px;
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
      border-top: 1px solid #17313a;
      background: #020405;
    }

    .ticker-track {
      display: flex;
      width: max-content;
      animation: scroll 28s linear infinite;
    }
